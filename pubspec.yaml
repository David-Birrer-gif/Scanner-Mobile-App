name: scanner_mobile_app
description: Offline-first fridge scanner app for groceries.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.13.0
  flutter_local_notifications: ^17.2.3
  dio: ^5.7.0
  intl: ^0.20.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.21.2
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
